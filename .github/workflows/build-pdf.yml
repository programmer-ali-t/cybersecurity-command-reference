name: Build PDF

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-extra \
            fonts-dejavu \
            python3

      - name: Preprocess markdown
        run: |
          mkdir -p build
          python3 - << 'PYEOF'
          import os, glob, re

          src_dir = 'src/volume-1-linux-core'
          out_dir = 'build'
          os.makedirs(out_dir, exist_ok=True)

          def fix_tables(text):
              """Convert broken pipe tables to clean pipe tables."""
              lines = text.split('\n')
              out = []
              in_code = False
              i = 0
              while i < len(lines):
                  line = lines[i]
                  s = line.strip()

                  # Track code fences
                  if s.startswith('```'):
                      in_code = not in_code
                      out.append(line)
                      i += 1
                      continue

                  if in_code:
                      out.append(line)
                      i += 1
                      continue

                  # Detect a pipe table
                  if s.startswith('|') and s.endswith('|') and s.count('|') >= 3:
                      # Collect the whole table
                      table_lines = []
                      while i < len(lines) and lines[i].strip().startswith('|') and lines[i].strip().endswith('|'):
                          table_lines.append(lines[i])
                          i += 1

                      # Normalize spacing on pipes
                      cleaned = []
                      for tl in table_lines:
                          cells = [c.strip() for c in tl.strip().strip('|').split('|')]
                          cleaned.append('| ' + ' | '.join(cells) + ' |')

                      # Ensure there's a separator row (line 2). If not, insert one.
                      if len(cleaned) >= 2:
                          sep_test = cleaned[1].strip('| ').replace(' ', '')
                          if not re.fullmatch(r'[:\-]+', sep_test):
                              # Insert a separator after header
                              ncols = cleaned[0].count('|') - 1
                              cleaned.insert(1, '| ' + ' | '.join(['---'] * ncols) + ' |')
                          else:
                              # Ensure separator has 3+ dashes per cell
                              cells = [c.strip() for c in cleaned[1].strip('|').split('|')]
                              cells = [(':' if c.startswith(':') else '') + '-' * max(3, len(c.replace(':', ''))) + (':' if c.endswith(':') else '') for c in cells]
                              cleaned[1] = '| ' + ' | '.join(cells) + ' |'

                      out.extend(cleaned)
                      continue

                  out.append(line)
                  i += 1

              return '\n'.join(out)

          def strip_frontmatter(content):
              if content.startswith('---'):
                  parts = content.split('---', 2)
                  if len(parts) >= 3:
                      return parts[2].lstrip('\n')
              return content

          # Process front matter — convert \newpage to markdown page break
          fm_src = 'src/frontmatter/00-front.md'
          if os.path.exists(fm_src):
              with open(fm_src, 'r', encoding='utf-8') as fp:
                  content = fp.read()
              content = strip_frontmatter(content)
              # Replace \newpage with a raw LaTeX page break that pandoc passes through
              content = content.replace('\\newpage', '\n\\newpage\n')
              with open('build/00-front.md', 'w', encoding='utf-8') as fp:
                  fp.write(content)

          # Process entries
          for path in sorted(glob.glob(f'{src_dir}/*.md')):
              with open(path, 'r', encoding='utf-8') as fp:
                  content = fp.read()
              content = strip_frontmatter(content)
              content = fix_tables(content)
              name = os.path.basename(path)
              with open(f'{out_dir}/{name}', 'w', encoding='utf-8') as fp:
                  fp.write(content)

          print(f'Preprocessed {len(glob.glob(f"{out_dir}/*.md"))} files')
          PYEOF

      - name: Build PDF
        run: |
          mkdir -p output
          pandoc \
            build/00-front.md \
            build/001-pwd.md \
            build/002-ls.md \
            build/003-stat.md \
            build/004-file.md \
            build/005-less.md \
            build/006-tail.md \
            build/007-head.md \
            build/008-wc.md \
            build/009-cut.md \
            build/010-sort.md \
            --from markdown+pipe_tables+raw_tex+raw_html+backtick_code_blocks+fenced_code_blocks+header_attributes+auto_identifiers+footnotes+definition_lists+smart \
            --to latex \
            --pdf-engine=xelatex \
            --toc \
            --toc-depth=1 \
            --highlight-style=tango \
            --wrap=preserve \
            --include-in-header=templates/header.tex \
            -V geometry:a4paper \
            -V geometry:margin=2cm \
            -V fontsize=10pt \
            -V linestretch=1.15 \
            -V mainfont="DejaVu Serif" \
            -V monofont="DejaVu Sans Mono" \
            -V sansfont="DejaVu Sans" \
            -V colorlinks=true \
            --metadata title="The Cybersecurity Command Reference" \
            --metadata subtitle="Authorized Operator Edition — Volume I: Linux Core Operations" \
            --metadata author="Ali Hazim" \
            --metadata date="v1.0.0 — 2026" \
            -o output/ccsr-v1.0.0.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccsr-v1.0.0-pdf
          path: output/ccsr-v1.0.0.pdf

      - name: Attach PDF to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: output/ccsr-v1.0.0.pdf
