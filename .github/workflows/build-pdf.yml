name: Build PDF

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-latex-extra \
            fonts-dejavu \
            python3

      - name: Verify required files exist
        run: |
          echo "Checking files..."
          test -f src/frontmatter/00-front.md || (echo "MISSING: src/frontmatter/00-front.md" && exit 1)
          test -f templates/header.tex || (echo "MISSING: templates/header.tex" && exit 1)
          ls -la src/volume-1-linux-core/*.md
          echo "All required files present"

      - name: Strip YAML frontmatter from entries
        run: |
          mkdir -p build
          python3 - << 'PYEOF'
          import os, glob
          src_dir = 'src/volume-1-linux-core'
          out_dir = 'build'
          os.makedirs(out_dir, exist_ok=True)
          for path in sorted(glob.glob(f'{src_dir}/*.md')):
              with open(path, 'r', encoding='utf-8') as fp:
                  content = fp.read()
              if content.startswith('---'):
                  parts = content.split('---', 2)
                  if len(parts) >= 3:
                      content = parts[2].lstrip('\n')
              name = os.path.basename(path)
              with open(f'{out_dir}/{name}', 'w', encoding='utf-8') as fp:
                  fp.write(content)
          print(f'Processed {len(os.listdir(out_dir))} files')
          PYEOF

      - name: Build PDF from entries
        run: |
          mkdir -p output
          pandoc \
            src/frontmatter/00-front.md \
            build/*.md \
            --from markdown \
            --to pdf \
            --pdf-engine=xelatex \
            --toc \
            --toc-depth=1 \
            --highlight-style=tango \
            --wrap=preserve \
            --include-in-header=templates/header.tex \
            -V geometry:a4paper \
            -V geometry:margin=2cm \
            -V fontsize=10pt \
            -V linestretch=1.15 \
            -V mainfont="DejaVu Serif" \
            -V monofont="DejaVu Sans Mono" \
            -V colorlinks=true \
            -V linkcolor=ccsrAccent \
            -V urlcolor=ccsrAccent \
            --metadata title="The Cybersecurity Command Reference" \
            --metadata subtitle="Authorized Operator Edition — Volume I" \
            --metadata author="Ali Hazim" \
            --metadata date="v1.0.0 — 2026" \
            -o output/ccsr-v1.0.0.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccsr-v1.0.0-pdf
          path: output/ccsr-v1.0.0.pdf

      - name: Attach PDF to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: output/ccsr-v1.0.0.pdf
